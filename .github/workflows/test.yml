name: 🔁 Qastra SmartBot CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: ✅ Run test CLI (Flake + Visual Validation)
      run: |
        source venv/bin/activate
        python runner/test_runner.py --module test_login || true
        python visual_validator/validator.py --module test_login || true

    - name: 🧪 Output test complete
      run: echo "Test Execution Complete ✅"
